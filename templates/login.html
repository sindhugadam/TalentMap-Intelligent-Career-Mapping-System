<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Career Guidance</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0b0f14, #111827, #0f172a);
            color: #e5e7eb;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 500px;
            margin: 70px auto;
        }

        .card {
            background: rgba(31, 41, 55, 0.92);
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: #9ca3af;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            margin-top: 18px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #374151;
            background: #111827;
            color: white;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #06b6d4, #2563eb);
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: linear-gradient(90deg, #0891b2, #1d4ed8);
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

        .links a {
            color: #22d3ee;
            text-decoration: none;
            font-weight: bold;
        }

        .links a:hover {
            color: #67e8f9;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Login</h1>
            <p>Login to save your career history and personalized results.</p>

            <form action="/login" method="POST">
                <label for="email">Email</label>
                <input type="email" name="email" id="email" required>

                <label for="password">Password</label>
                <input type="password" name="password" id="password" required>

                <button type="submit">Login</button>
            </form>

            <div class="links">
                <p>Don't have an account? <a href="/signup">Signup</a></p>
                <p><a href="/">Back to Home</a></p>
            </div>
        </div>
    </div>
</body>
</html>
